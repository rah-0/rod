<html>
  <head>
    <title>Rod Monitor - Pages</title>
    <style>
      body {
        margin: 0;
        background: #2d2c2f;
        color: white;
        padding: 20px;
        font-family: sans-serif;
      }
      a {
        color: white;
        padding: 1em;
        margin: 0.5em 0;
        font-size: 1em;
        text-decoration: none;
        display: block;
        border-radius: 0.3em;
        border: 1px solid transparent;
        background: #212225;
      }
      a:visited {
        color: #c3c3c3;
      }
      a:hover {
        background: #25272d;
        border-color: #8d8d96;
      }
    </style>
  </head>
  <body>
    <h3>Choose a Page to Monitor</h3>

    <div id="targets"></div>

    <script>
      const targets = document.getElementById('targets')

      async function update() {
        try {
          const response = await fetch('api/pages')
          if (!response.ok) throw new Error(`HTTP ${response.status}`)
          const list = await response.json()
          const links = document.createDocumentFragment()

          list.forEach((target) => {
            if (
              typeof target.targetId !== 'string' ||
              target.targetId.length === 0 ||
              typeof target.title !== 'string' ||
              typeof target.url !== 'string'
            ) {
              return
            }

            const url = new URL(
              `page/${encodeURIComponent(target.targetId)}`,
              window.location.href,
            )
            if (url.origin !== window.location.origin) return

            const link = document.createElement('a')
            link.href = url.href
            link.title = target.url
            link.textContent = target.title
            links.appendChild(link)
          })

          targets.replaceChildren(links)
        } catch (error) {
          console.error('Cannot refresh monitor pages:', error)
        } finally {
          setTimeout(update, 1000)
        }
      }

      update()
    </script>
  </body>
</html>
